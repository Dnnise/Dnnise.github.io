<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dnnise 的个人网站</title>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 50px 40px;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: transform 0.3s ease;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        /* ===== 头像 ===== */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            font-weight: 600;
            color: #fff;
            margin: 0 auto 20px;
            box-shadow: 0 12px 28px rgba(245, 87, 108, 0.35);
            user-select: none;
        }

        /* ===== 标题 ===== */
        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 24px;
            font-weight: 300;
        }

        /* ===== 分割线 ===== */
        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #f093fb, #f5576c);
            margin: 0 auto 28px;
            border-radius: 4px;
        }

        /* ===== 关于我 ===== */
        .about {
            color: rgba(255, 255, 255, 0.85);
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 32px;
            text-align: left;
            padding: 0 4px;
        }

        .about strong {
            color: #f093fb;
            font-weight: 600;
        }

        /* ===== 技能标签 ===== */
        .skills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 34px;
        }

        .skill-tag {
            background: rgba(255, 255, 255, 0.10);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.25s;
            cursor: default;
            backdrop-filter: blur(4px);
        }

        .skill-tag:hover {
            background: rgba(245, 87, 108, 0.25);
            border-color: #f5576c;
            color: #fff;
            transform: scale(1.05);
        }

        /* ===== 社交按钮 ===== */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .social-btn {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.13);
            transition: 0.3s ease;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }

        .social-btn:hover {
            background: #f5576c;
            border-color: #f5576c;
            transform: scale(1.04);
            box-shadow: 0 8px 24px rgba(245, 87, 108, 0.35);
        }

        .social-btn.github:hover {
            background: #6e5494;
            border-color: #6e5494;
            box-shadow: 0 8px 24px rgba(110, 84, 148, 0.40);
        }

        /* ===== 页脚 ===== */
        .footer {
            margin-top: 36px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.3px;
        }

        .footer span {
            color: #f5576c;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 500px) {
            .card {
                padding: 32px 20px;
            }
            h1 {
                font-size: 26px;
            }
            .avatar {
                width: 90px;
                height: 90px;
                font-size: 38px;
            }
            .social-btn {
                padding: 10px 22px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- 头像 -->
        <div class="avatar">🌊</div>

        <!-- 标题 -->
        <h1>Dnnise</h1>
        <p class="subtitle">✨ 用代码搭建属于我的小世界</p>

        <div class="divider"></div>

        <!-- 关于我 -->
        <div class="about">
            <p>
                👋 你好呀！我是 <strong>Dnnise</strong>，一名热爱编程与设计的开发者。<br>
                喜欢捣鼓前端、探索新技术，也享受把想法变成现实的过程。<br>
                这个站点是我的 GitHub Pages 小天地，未来会在这里分享：
            </p>
            <ul style="margin-top: 12px; padding-left: 20px; color: rgba(255,255,255,0.75);">
                <li>📝 学习笔记 &amp; 技术文章</li>
                <li>🎨 个人项目 &amp; 小工具</li>
                <li>🚀 成长路上的点滴</li>
            </ul>
        </div>

        <!-- 技能标签 -->
        <div class="skills">
            <span class="skill-tag">HTML5</span>
            <span class="skill-tag">CSS3</span>
            <span class="skill-tag">JavaScript</span>
            <span class="skill-tag">React</span>
            <span class="skill-tag">Git</span>
            <span class="skill-tag">Python</span>
        </div>

        <!-- 社交链接 -->
        <div class="social-links">
            <a href="https://github.com/Dnnise" target="_blank" class="social-btn github">
                🐙 GitHub
            </a>
            <a href="#" class="social-btn">
                📧 联系我
            </a>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            🌟 用 <span>❤</span> 打造 &nbsp;·&nbsp; 2026
        </div>

    </div>

</body>
</html>
